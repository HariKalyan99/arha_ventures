<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/arha-mark.png?v=10" />
    <link rel="shortcut icon" type="image/png" href="/brand/arha-mark.png?v=10" />
    <link rel="apple-touch-icon" href="/brand/arha-mark.png?v=10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee6" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="ARHA — an architecture and interior design studio composing residences, villas and hospitality spaces in stone, timber and light."
    />
    <meta property="og:title" content="ARHA — Architecture & Interiors" />
    <meta property="og:description" content="Interiors composed in stone, timber and light." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/arha-logo.png?v=7" />
    <title>ARHA — Architecture & Interiors</title>
    <script>
      /* Apply stored theme before paint to avoid a light→dark flash */
      (function () {
        try {
          var t = localStorage.getItem('arha-theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'dark' ? '#171717' : '#f3eee6')
          var scheme = document.querySelector('meta[name="color-scheme"]')
          if (scheme) scheme.setAttribute('content', t)
          window.__arhaBootTheme = t
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          window.__arhaBootTheme = 'light'
        }
      })()
    </script>
    <style>
      /* Critical boot styles — painted before the JS bundle arrives */
      html.is-booting,
      html.is-booting body {
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #e8e0d2;
        transition:
          opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0.75s;
      }
      html[data-theme='dark'] #boot {
        background: #111111;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-inner {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translate(-50%, -50%);
      }
      .boot-mark {
        display: flex;
        width: clamp(10rem, 34vw, 16rem);
        height: clamp(10rem, 34vw, 16rem);
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        box-shadow: none;
        animation: boot-rise 2.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
      }
      .boot-dots {
        position: absolute;
        top: calc(100% + 1.5rem);
        left: 50%;
        display: flex;
        gap: 0.5rem;
        transform: translateX(-50%);
        opacity: 0;
        animation: boot-dots-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
      }
      .boot-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #934236;
        animation: boot-dot 1.25s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .boot-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translate3d(0, 3.25rem, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes boot-dots-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.28;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .boot-dots {
          animation: none;
          opacity: 1;
        }
        .boot-dots span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading ARHA">
      <div class="boot-inner">
        <div class="boot-mark">
          <img id="boot-logo" src="/brand/arha-logo.png?v=7" alt="" width="700" height="620" decoding="async" fetchpriority="high" />
        </div>
        <div class="boot-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script>
      /* Swap boot lockup to match theme before the mark paints */
      (function () {
        var t = window.__arhaBootTheme || 'light'
        var img = document.getElementById('boot-logo')
        if (img && t === 'dark') img.src = '/brand/arha-logo-on-dark.png?v=7'
      })()
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: serif; color: #e8e0d2; background: #171717">
        ARHA — Architecture &amp; Interiors. This experience requires JavaScript.
      </p>
    </noscript>
    <!--
      Failsafe: only dismiss boot once React has mounted (#root has children).
      Dev-over-tunnel used to hit 7s before modules arrived → blank page after splash.
    -->
    <script>
      (function () {
        var started = Date.now()
        var MAX_MS = 60000
        function dismiss(boot) {
          if (!boot || boot.classList.contains('is-done')) return
          boot.classList.add('is-done')
          document.documentElement.classList.remove('is-booting')
          setTimeout(function () {
            boot.remove()
          }, 800)
        }
        function tick() {
          var boot = document.getElementById('boot')
          if (!boot || boot.classList.contains('is-done')) return
          var root = document.getElementById('root')
          var mounted = root && root.childNodes.length > 0
          var elapsed = Date.now() - started
          /* Prefer BootLoader dismiss; only force after mount + grace, or hard timeout */
          if (mounted && elapsed > 12000) {
            dismiss(boot)
            return
          }
          if (!mounted && elapsed > MAX_MS) {
            dismiss(boot)
            return
          }
          setTimeout(tick, 400)
        }
        setTimeout(tick, 7000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
